# Проверки на каждый пуш и пул-реквест — перед выкладкой на сервер:
# типы, генерация Prisma-клиента и production-сборка Next.js. Красный CI останавливает
# автовыкладку на сервер: сервер берёт код из main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Сборке нужны имена переменных, но не рабочие значения: база на этом шаге не нужна
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      JWT_SECRET: ci-only-not-a-secret
      APP_URL: https://example.com
      LOCAL_STORAGE_ROOT: /tmp/ci-storage
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # npm ci требует идеально совпадающего lock-файла (в проекте он расходится по транзитивной @types)
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Генерация клиента Prisma
        run: npx prisma generate

      # next-env.d.ts создаёт сам Next.js при сборке, и он в .gitignore: в свежем клоне
      # его нет, из-за чего tsc не находит типы для картинок и шрифтов. Создаём заранее —
      # ровно тем содержимым, что генерирует Next.
      - name: Подготовка типов Next.js
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Сборка приложения
        run: npm run build

  # Интеграционные тесты на настоящей PostgreSQL: права по разделам, нумерация документов, учёт оплаты (идемпотентность,
  # параллельные платежи), склад, каскад имён клиента, охрана удаления, сроки и уведомления. Красный тест останавливает
  # выкладку так же, как красная сборка.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      JWT_SECRET: ci-only-not-a-secret
      APP_URL: https://example.com
      LOCAL_STORAGE_ROOT: /tmp/ci-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Схема базы и клиент Prisma
        run: npx prisma db push --accept-data-loss && npx prisma generate
      - name: Проверка согласованности связей на пустой базе (скрипт не должен падать)
        run: node scripts/reconcile-links.mjs
      - name: Тесты
        run: npm test
