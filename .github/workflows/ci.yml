# Проверки на каждый пуш и пул-реквест — то, что раньше делал Vercel перед выкладкой:
# типы, генерация Prisma-клиента и production-сборка Next.js. Красный CI останавливает
# автовыкладку на сервер: зелёный коммит попадает в ветку deploy (см. задачу publish-deploy ниже), а сервер берёт только её.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Сборке нужны имена переменных, но не рабочие значения: база на этом шаге не нужна
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      JWT_SECRET: ci-only-not-a-secret
      APP_URL: https://example.com
      LOCAL_STORAGE_ROOT: /tmp/ci-storage
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # npm ci требует идеально совпадающего lock-файла (в проекте он расходится по транзитивной @types)
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Генерация клиента Prisma
        run: npx prisma generate

      # next-env.d.ts создаёт сам Next.js при сборке, и он в .gitignore: в свежем клоне
      # его нет, из-за чего tsc не находит типы для картинок и шрифтов. Создаём заранее —
      # ровно тем содержимым, что генерирует Next.
      - name: Подготовка типов Next.js
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Сборка приложения
        run: npm run build

  # Зелёный коммит из main публикуется в ветку deploy: сервер выкладывает ТОЛЬКО её. Так автовыкладке не нужен публичный API
  # GitHub для проверки статуса CI, и репозиторий можно держать приватным (сервер читает код по read-only deploy-ключу).
  # Ветка движется только вперёд: более старый коммит, закончивший проверку позже нового, её не откатит.
  publish-deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: publish-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Опубликовать проверенный коммит в ветку deploy
        run: |
          git fetch origin deploy || true
          if git rev-parse -q --verify refs/remotes/origin/deploy >/dev/null && ! git merge-base --is-ancestor refs/remotes/origin/deploy HEAD; then
            echo "deploy уже впереди этого коммита — пропускаю"
          else
            git push origin HEAD:refs/heads/deploy
          fi
