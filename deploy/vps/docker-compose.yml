# Всё на одном облачном сервере: Caddy (HTTPS) + приложение + PostgreSQL. Внешних сетей не нужно.
# Запуск (из этого каталога, рядом лежит .env — образец в env.example):
#   docker compose up -d --build
name: firmspace

services:
  caddy:
    image: caddy:2
    container_name: firmspace-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Домены через запятую, как в Caddyfile: например "firmspace.de, www.firmspace.de"
      SITE_DOMAINS: ${SITE_DOMAINS:?задайте SITE_DOMAINS в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - crm

  crm:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: firmspace-crm:latest
    container_name: firmspace-crm
    restart: unless-stopped
    env_file: .env
    environment:
      DEPLOYED_COMMIT: ${DEPLOYED_COMMIT:-}
      AGENT_BLOG_AUTOPUBLISH: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - crm_storage:/data/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postgres:
    image: postgres:${PG_VERSION:-16}
    container_name: firmspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: crm
    volumes:
      - pg_data:/var/lib/postgresql/data
    # наружу порт не публикуем: к базе ходит только приложение внутри сети compose
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_app -d crm"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
  crm_storage:
  pg_data:
