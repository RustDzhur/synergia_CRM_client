# Всё на одном облачном сервере: Caddy (HTTPS) + приложение + PostgreSQL. Внешних сетей не нужно.
# Запуск (из этого каталога, рядом лежит .env — образец в env.example):
#   docker compose up -d --build
name: firmspace

services:
  caddy:
    image: caddy:2
    container_name: firmspace-caddy
    restart: unless-stopped
    # Сеть хоста, как на прежнем сервере: Caddy ходит к сайту (127.0.0.1:3210), Harness (127.0.0.1:3080) 
    network_mode: host
    environment:
      # Домены через запятую, как в Caddyfile: например "firmspace.de, www.firmspace.de"
      SITE_DOMAINS: ${SITE_DOMAINS:?задайте SITE_DOMAINS в .env}
      # Вход в Harness: логин и хеш пароля (caddy hash-password); без них Caddy не запустится — это защита
      HARNESS_USER: ${HARNESS_USER:?задайте HARNESS_USER в .env}
      HARNESS_PASS_HASH: ${HARNESS_PASS_HASH:?задайте HARNESS_PASS_HASH в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - crm

  crm:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: firmspace-crm:latest
    container_name: firmspace-crm
    restart: unless-stopped
    env_file: .env
    networks: [db, ai]
    ports:
      # Только на самом сервере (Caddy и агенты Harness ходят на 127.0.0.1:3210), наружу не открыт
      - "127.0.0.1:3210:3000"
    environment:
      DEPLOYED_COMMIT: ${DEPLOYED_COMMIT:-}
      AGENT_BLOG_AUTOPUBLISH: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - crm_storage:/data/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postgres:
    networks: [db]
    image: postgres:${PG_VERSION:-16}
    container_name: firmspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: crm
    volumes:
      - pg_data:/var/lib/postgresql
    # наружу порт не публикуем: к базе ходит только приложение внутри сети compose
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_app -d crm"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # --- Сервисы ИИ: те же имена и порты, что на старом сервере (CRM ходит к ним по сети compose) ---
  # Whisper (диктовка): TRANSCRIBE_API_URL=http://speaches:8000/v1
  speaches:
    networks: [ai]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: speaches
    restart: unless-stopped
    environment:
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__CPU_THREADS: "4"
      WHISPER__COMPUTE_TYPE: int8
      STT_MODEL_TTL: "-1"
      PRELOAD_MODELS: '["Systran/faster-whisper-small"]'
      LOG_LEVEL: info
      ENABLE_UI: "false"
    volumes:
      - speaches_cache:/home/ubuntu/.cache/huggingface/hub
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Голос Айрис (TTS): http://tts:5050/v1 — значение по умолчанию в коде
  tts:
    networks: [ai]
    image: travisvn/openai-edge-tts:latest
    container_name: tts
    restart: unless-stopped
    environment:
      PORT: "5050"
      REQUIRE_API_KEY: "False"
      DEFAULT_VOICE: ru-RU-SvetlanaNeural
      DEFAULT_LANGUAGE: ru-RU
      DEFAULT_RESPONSE_FORMAT: mp3
      DEFAULT_SPEED: "1.0"
      REMOVE_FILTER: "False"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

# Сети разделены по назначению: базу видит только сайт; ИИ-сервисы (Whisper, TTS, Redis) изолированы друг от друга
# и от базы. db — без выхода в интернет (internal), ai — с выходом (TTS ходит к внешним сервисам).
networks:
  db:
    internal: true
  ai:

volumes:
  caddy_data:
  caddy_config:
  crm_storage:
  pg_data:
  speaches_cache:
