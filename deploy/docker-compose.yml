# Дубликат CRM на своём сервере: тот же код, но база — PostgreSQL, файлы — каталог на диске.
# Оригинал на Vercel продолжает работать на MongoDB + Firebase Storage; это отдельный контур.
#
# Запуск (на сервере, из каталога с Dockerfile и .env):
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  crm:
    build:
      context: ..
      dockerfile: Dockerfile
    image: firmspace-crm:latest
    container_name: firmspace-crm
    restart: unless-stopped
    env_file: .env
    environment:
      # Хеш коммита, собранного автовыкладкой (в .env его пишет deploy/autodeploy.sh)
      DEPLOYED_COMMIT: ${DEPLOYED_COMMIT:-}
      # Автопубликация статей блога агентом: включена постоянно (решение владельца).
      AGENT_BLOG_AUTOPUBLISH: "1"
    # Наружу порт не публикуем: сначала проверяем по SSH-туннелю, публичный адрес добавит Caddy.
    ports:
      - "127.0.0.1:3210:3000"
    volumes:
      # Файлы и фото: каталог внутри тома, LOCAL_STORAGE_ROOT указывает сюда
      - crm_storage:/data/storage
      # Выдача токенов агентам из админки: сайт кладёт сюда файл <агент>.env, Harness видит его как /workspace/_creds/<агент>.env
      - ${AGENT_CREDS_DIR:-/home/server/agents/_creds}:/agent-creds
    # Проверка живости на уровне Docker: видно в docker ps и перезапускается сам
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    # Логи контейнера не растут бесконечно
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - db
      - ai

# Имена сетей на сервере: firmspace_db (там postgres) и firmspace_ai (озвучка, распознавание речи).
# Если у вас они называются иначе — задайте DB_NETWORK и AI_NETWORK в deploy/.env (docker network ls покажет имена).
networks:
  db:
    external: true
    name: ${DB_NETWORK:-firmspace_db}
  ai:
    external: true
    name: ${AI_NETWORK:-firmspace_ai}

volumes:
  crm_storage:
