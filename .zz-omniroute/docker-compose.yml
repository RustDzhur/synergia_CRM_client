# OmniRoute on ai-server — https://omiroute.firmspace.eu
# Caddy (on the host) terminates TLS and proxies the domain to 127.0.0.1:3111.
# Both published ports are loopback-only: nothing is exposed directly.
#
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
services:
  redis:
    image: redis:8.6.5-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    # Deliberately not published to the host — the app reaches it over the
    # compose network. An unauthenticated Redis on 0.0.0.0 is a footgun.
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379
    ports:
      # Host 3111 -> container dashboard+API 20128 (Caddy points at 3111).
      - "127.0.0.1:3111:20128"
      # Live dashboard WebSocket; Caddy routes /live-ws here.
      - "127.0.0.1:20132:20132"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  redis-data:
